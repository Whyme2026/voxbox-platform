<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vox Boxes</title>
  <style>
    @font-face { font-family: "Fredoka"; src: url("polices/fredoka.woff") format("woff"); font-weight: 300 700; font-display: swap; }
    @font-face { font-family: "Gabarito"; src: url("polices/gabarito.woff") format("woff"); font-weight: 400 900; font-display: swap; }
    :root { --vox: #3F4C8F; --parole: #F2D27A; --fond: #F1F2F6; --encre: #23263F; --doux: #5D6280; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fond); color: var(--encre);
           font: 17px/1.5 "Gabarito", system-ui, sans-serif; }
    main { display: flex; flex-direction: column; gap: 18px; max-width: 520px; }
    h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 44px; line-height: 1.05; margin: 0; }
    p { margin: 0; color: var(--doux); }
    .liens { display: flex; flex-wrap: wrap; gap: 12px; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 26px 26px 6px 26px; text-decoration: none;
        font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 20px; background: var(--parole); color: var(--encre); }
    a.vox { background: var(--vox); color: #fff; border-radius: 26px 26px 26px 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Vox Boxes</h1>
    <p>Cabines vidéo d'avis consommateurs, by whyme.</p>
    <div class="liens"><a class="vox" href="admin/">Espace de gestion</a><a href="cabine/">Écran de cabine</a></div>
  </main>
</body>
</html>
