<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vox Boxes</title>
  <style>
    :root { color-scheme: light dark; --fond: #f6f4ef; --texte: #1d1b18; --doux: #6b665d; }
    @media (prefers-color-scheme: dark) { :root { --fond: #151412; --texte: #f1eee8; --doux: #a29c91; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); color: var(--texte);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 2.25rem; letter-spacing: -0.02em; margin: 0; }
    p { margin: .25rem 0 0; color: var(--doux); }
  </style>
</head>
<body>
  <main>
    <h1>Vox Boxes</h1>
    <p>by whyme — plateforme en construction.</p>
  </main>
</body>
</html>
