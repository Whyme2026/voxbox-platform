<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#221F3A">
  <title>Vox Box</title>
  <link rel="stylesheet" href="cabine.css">
</head>
<body>
  <div class="cabine" id="cabine">
    <header class="entete">
      <img class="logo" id="logo" alt="" hidden>
      <span class="marque" id="marque"></span>
      <span class="etat-reseau" id="etat-reseau" aria-live="polite"></span>
    </header>

    <section class="zone-camera" id="zone-camera" hidden>
      <div class="cadre">
        <video id="video" muted playsinline autoplay></video>
        <svg class="anneau" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse class="anneau-fond" cx="50" cy="50" rx="46" ry="46" />
          <ellipse class="anneau-voix" id="anneau-voix" cx="50" cy="50" rx="46" ry="46" />
          <ellipse class="anneau-temps" id="anneau-temps" cx="50" cy="50" rx="46" ry="46" pathLength="100" />
        </svg>
        <div class="compte" id="compte" aria-live="assertive"></div>
        <div class="voyant" id="voyant" hidden>Enregistrement</div>
      </div>
    </section>

    <main class="scene" id="scene" aria-live="polite"></main>
    <div class="clavier" id="clavier"></div>

    <footer class="pied"><span>by whyme</span></footer>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
