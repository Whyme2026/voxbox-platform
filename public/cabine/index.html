<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F1F2F6">
  <title>Parlobox</title>
  <!-- Application installable en plein écran (Chrome Android : menu > Installer l'application).
       use-credentials : en production la cabine est derrière Cloudflare Access, le manifeste doit partir avec le cookie. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icones/icone-apple-180.png">
  <link rel="preload" href="../polices/fredoka.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="../polices/gabarito.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="../polices/inter.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="cabine.css">
</head>
<body>
  <div class="cabine" id="cabine">
    <!-- Décor : les bulles de la conversation, en teintes pâles (accueil et fin seulement). -->
    <div class="decor" aria-hidden="true">
      <svg class="decor-1" viewBox="0 0 48 40"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z"/></svg>
      <svg class="decor-2" viewBox="0 0 48 40"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z"/></svg>
      <svg class="envol envol-1" viewBox="0 0 48 40"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z"/></svg>
      <svg class="envol envol-2" viewBox="0 0 48 40"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z"/></svg>
      <svg class="envol envol-3" viewBox="0 0 48 40"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z"/></svg>
      <svg class="envol envol-4" viewBox="0 0 48 40"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z"/></svg>
    </div>

    <header class="entete">
      <!-- À gauche, le client : son logo (sinon son nom, campagne habillée) et la ligne de la campagne (habillage.entete).
           À droite, les repères du parcours puis la signature « parlobox by whyme », sur tous les écrans. -->
      <img class="logo" id="logo" alt="" hidden>
      <span class="nom-marque" id="nom-marque" hidden></span>
      <span class="entete-texte" id="entete-texte" hidden></span>
      <span class="etat-reseau" id="etat-reseau" aria-live="polite"></span>
      <div class="reperes" id="reperes"></div>
      <span class="signature" id="signature" aria-label="parlobox by whyme">
        <svg viewBox="0 0 48 40" aria-hidden="true"><path d="M10 3h28a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H22c-3 4-8 7-14 7 3-2 4-4 4-7h-2a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7z" class="signature-bulle"/><g fill="#FFFFFF"><rect x="13" y="13" width="3.6" height="7" rx="1.8"/><rect x="19.6" y="9.5" width="3.6" height="14" rx="1.8"/><rect x="26.2" y="11.5" width="3.6" height="10" rx="1.8"/><rect x="32.8" y="14" width="3.6" height="5" rx="1.8"/></g></svg>
        <span class="signature-mot" aria-hidden="true">parlobox</span>
        <span class="signature-by" aria-hidden="true">by <b>whyme</b></span>
      </span>
    </header>

    <main class="scene" id="scene" aria-live="polite"></main>
    <div class="clavier" id="clavier"></div>
    <!-- Sous le clavier : ce que l'écran y place (accord et bouton de l'écran du prénom). -->
    <div class="sous-clavier" id="sous-clavier"></div>
  </div>

  <!-- Aperçu caméra : un seul élément, déplacé dans l'écran qui en a besoin. Même format que l'enregistrement (4:3). -->
  <div class="apercu" id="apercu" hidden>
    <video id="video" muted playsinline autoplay></video>
    <!-- Guide de cadrage (écran « cadrage » seulement) : ovale du visage et épaules, le reste de l'image légèrement voilé. -->
    <div class="guide-cadrage" id="guide-cadrage" aria-hidden="true">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
        <path class="voile" fill-rule="evenodd" d="M0 0H400V300H0Z M128 134a72 94 0 1 0 144 0a72 94 0 1 0 -144 0Z"/>
        <ellipse class="contour" cx="200" cy="134" rx="72" ry="94"/>
        <path class="epaules" d="M84 300C96 246 142 232 200 232C258 232 304 246 316 300"/>
      </svg>
    </div>
    <div class="compte" id="compte" aria-live="assertive" hidden>
      <span class="compte-bulle" id="compte-chiffre"></span>
      <span class="compte-texte" id="compte-detail"></span>
    </div>
    <div class="rec" id="rec" hidden>
      <span class="rec-point"></span><span>REC</span><span class="chrono" id="chrono">0:00</span>
    </div>
  </div>

  <!-- État de la prise, au-dessus de l'aperçu : la voix qui est écoutée (rien pendant la lecture). -->
  <div class="ecoute" id="ecoute" hidden>
    <span class="onde" id="onde" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="ecoute-texte" id="ecoute-texte">On vous écoute…</span>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
